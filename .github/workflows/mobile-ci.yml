name: Mobile CI Quality Gate

on:
  push:
    branches: [ master, main ]
    paths:
      - 'apps/mobile/**'
      - 'sync_config.js'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'apps/mobile/**'
      - 'sync_config.js'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

concurrency:
  group: "mobile-ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          pub-cache: true
          pub-cache-key: "pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}"
          cache-key: "flutter-sdk-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}"

      - name: Sync Configuration
        run: node sync_config.js

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Run Analyze (Static Analysis)
        run: flutter analyze --no-fatal-warnings
        working-directory: apps/mobile

      - name: Run Flutter Unit/Widget Tests
        run: flutter test
        working-directory: apps/mobile

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [analyze-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          pub-cache: true
          pub-cache-key: "pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}"
          cache-key: "flutter-sdk-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}"

      - name: Sync Configuration
        run: node sync_config.js

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Build Android Release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
        working-directory: apps/mobile

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    needs: [analyze-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          pub-cache: true
          pub-cache-key: "pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}"
          cache-key: "flutter-sdk-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}"

      - name: Sync Configuration
        run: node sync_config.js

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Build iOS Release App
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
        working-directory: apps/mobile

      - name: Zip iOS Build
        run: |
          cd apps/mobile/build/ios/iphoneos
          zip -r Runner.zip Runner.app

      - name: Upload iOS Release App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-ios
          path: apps/mobile/build/ios/iphoneos/Runner.zip
          retention-days: 7
