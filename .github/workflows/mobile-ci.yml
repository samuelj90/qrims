name: Mobile CI Quality Gate

on:
  push:
    branches: [ master, main ]
    paths:
      - 'apps/mobile/**'
      - 'sync_config.js'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'apps/mobile/**'
      - 'sync_config.js'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  mobile-test:
    name: Flutter Mobile CI & Build
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          pub-cache: true
          pub-cache-key: "pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}"
          cache-key: "flutter-sdk-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}"

      - name: Sync Configuration
        run: node sync_config.js
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Run Analyze (Static Analysis)
        run: flutter analyze --no-fatal-warnings
        working-directory: apps/mobile

      - name: Run Flutter Unit/Widget Tests
        run: flutter test
        working-directory: apps/mobile

      - name: Build Android Release APK
        run: flutter build apk --release
        working-directory: apps/mobile

      - name: Build iOS Release App
        run: flutter build ios --release --no-codesign
        working-directory: apps/mobile

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload iOS Release App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-ios
          path: apps/mobile/build/ios/iphoneos/Runner.app
          retention-days: 7
