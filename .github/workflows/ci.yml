name: CI Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: NestJS Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/backend
          npm ci

      - name: Run Prisma generator
        run: |
          cd apps/backend
          npx prisma generate

      - name: Run Linter
        run: |
          cd apps/backend
          npm run lint --if-present

      - name: Run TypeScript Compile check
        run: |
          cd apps/backend
          npm run build

  web-test:
    name: Next.js Web Portal CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Next.js Lint check
        run: |
          cd apps/web
          npm run lint --if-present

      - name: Run Next.js Build
        run: |
          cd apps/web
          npm run build

  mobile-test:
    name: Flutter Mobile CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Run Analyze (Static Analysis)
        run: |
          cd apps/mobile
          flutter analyze --no-fatal-warnings

      - name: Run Flutter Unit/Widget Tests
        run: |
          cd apps/mobile
          flutter test
