name: CI Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-test:
    name: NestJS Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/backend

      - name: Run Prisma generator
        run: npx prisma generate
        working-directory: apps/backend

      - name: Run ESLint Quality Check
        run: npm run lint
        working-directory: apps/backend

      - name: Run TypeScript Compile check
        run: npm run build
        working-directory: apps/backend

  # ── Web ───────────────────────────────────────────────────────────────────────
  web-test:
    name: Next.js Web Portal CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Next.js Lint check
        run: npm run lint
        working-directory: apps/web

      - name: Run Next.js Build
        run: npm run build
        working-directory: apps/web

  # ── Mobile ───────────────────────────────────────────────────────────────────
  mobile-test:
    name: Flutter Mobile CI & Build
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Sync Configuration
        run: node sync_config.js

      - name: Install dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Run Analyze (Static Analysis)
        run: flutter analyze --no-fatal-warnings
        working-directory: apps/mobile

      - name: Run Flutter Unit/Widget Tests
        run: flutter test
        working-directory: apps/mobile

      - name: Build Android Debug APK
        run: flutter build apk --debug
        working-directory: apps/mobile

      - name: Build Android Release APK
        run: flutter build apk --release
        working-directory: apps/mobile

      - name: Build iOS Debug App
        run: flutter build ios --debug --no-codesign
        working-directory: apps/mobile

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload iOS Debug App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-ios
          path: apps/mobile/build/ios/iphoneos/Runner.app

  # ── Docker ────────────────────────────────────────────────────────────────────
  docker-build-check:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Docker Compose Stack
        run: docker compose build
