name: CD Production Deployment

on:
  push:
    branches: [ master, main ]

# Cancel in-progress Pages deployments when a new push arrives
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Deploy NestJS API to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy API Backend
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
          working-directory: apps/backend
          vercel-args: '--prod'

  deploy-web:
    name: Deploy Next.js Web Console to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Web Client
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB }}
          working-directory: apps/web
          vercel-args: '--prod'

  # ── Landing Page → GitHub Pages ────────────────────────────────────────────
  deploy-pages:
    name: Deploy Landing Page to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: write        # deploy to GitHub Pages
      id-token: write     # verify deployment is from this repo

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload landing page as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy everything inside apps/landing-page/
          path: apps/landing-page

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
